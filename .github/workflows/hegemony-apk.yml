name: HEGEMONY APK
on:
  push:
    paths: ['hegemony-android/**','.github/workflows/hegemony-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: hegemony-android}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk hegemony.apk
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release delete hegemony-apk -y --cleanup-tag || true
          gh release create hegemony-apk hegemony.apk -t "HEGEMONY Android" -n "Κατέβασε το hegemony.apk στο κινητό και εγκατάστησέ το."
