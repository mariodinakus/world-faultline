name: PAX research checks
on:
  pull_request:
    paths:
      - "pax/**"
      - ".github/workflows/pax-research-checks.yml"
  push:
    branches: [main]
    paths:
      - "pax/**"
      - ".github/workflows/pax-research-checks.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --version
      - run: node pax/tests/research.test.cjs
      - run: node pax/tests/peace-economy.test.cjs
      - run: node pax/tests/peace-index-navigation.test.cjs
