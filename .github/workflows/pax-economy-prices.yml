name: PAX World Bank economic series
on:
  push:
    branches: [main]
    paths:
      - "pax/scripts/sync_economy_prices.py"
      - ".github/workflows/pax-economy-prices.yml"
  schedule:
    - cron: "18 08 5 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate XLSX parser against offline fixture
        run: python pax/tests/test_pinksheet_parser.py
      - name: Fetch and validate official World Bank Pink Sheet
        run: python pax/scripts/sync_economy_prices.py
      - name: Commit only changed sourced records
        run: |
          git add pax/data/economy-prices.json
          if git diff --cached --quiet; then
            echo "No new observations"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "PAX data: refresh verified World Bank monthly commodity prices"
          git push
